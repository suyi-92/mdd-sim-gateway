name: Feature request
description: Propose a device, carrier-independent capability, or UX improvement.
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Never include credentials, subscriber identifiers, hardware identities, phone numbers, private URLs, tokens, or message content.
  - type: textarea
    id: problem
    attributes:
      label: User problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Hardware and constraints
