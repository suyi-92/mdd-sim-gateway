name: Bug report
description: Report a reproducible MDD Sim Gateway problem without subscriber data.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never include a PIN, IMSI, ICCID, EID, IMEI, phone number, proxy URL, token, message content, or an unreviewed backup. Run mddctl doctor --json for a redacted starting point.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 1.7.0-vmware.1
    validations:
      required: true
  - type: dropdown
    id: hardware
    attributes:
      label: Hardware path
      options: [SCR Prime 04d9:c001, Quectel-class cellular modem, Other PC/SC reader, eUICC reader, Other]
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction and expected result
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Attach a reviewed support bundle if useful.
